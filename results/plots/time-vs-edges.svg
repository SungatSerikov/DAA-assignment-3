<title id="title">Measured graph algorithm runtime versus edges</title>
<desc id="description">Six algorithm and graph scenarios. Points show arithmetic means of five timed calls after ten warmups. The x axis uses a logarithmic scale; the y axis is linear in milliseconds, starting at zero. Straight lines connect measured points. Both graph vertices and edges vary between sizes.</desc>
